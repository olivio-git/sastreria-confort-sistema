{% extends 'misastreria/base.html' %}
{% block titulo %}{{ titulo }} - Sistema Financiero{% endblock %}
{% block contenido %}
<div class="container py-4">
    <h2 class="mb-4">{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="row">
            {% for field in form %}
            <div class="col-md-6 mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary" style="background-color: #2563eb; border-color: #2563eb;">
            <i class="bi bi-save"></i> Guardar
        </button>
        <a href="{% url 'lista_reparaciones' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
