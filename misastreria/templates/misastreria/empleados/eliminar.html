{% extends 'misastreria/base.html' %}
{% block titulo %}Eliminar Empleado{% endblock %}
{% block contenido %}
<div class="container py-4" style="background-color: #f1f5f9;">
    <h2 class="mb-4">Eliminar Empleado: {{ empleado }}</h2>
    <p>¿Estás seguro de que deseas eliminar a {{ empleado }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
