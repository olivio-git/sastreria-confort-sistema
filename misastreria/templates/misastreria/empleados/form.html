{% extends 'misastreria/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="form-container">

  <div class="page-header">
    <h1 class="page-title"><i class="bi bi-person me-2"></i>{{ titulo }}</h1>
    <a href="{% url 'lista_empleados' %}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
          <div class="col-md-6">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="alert alert-danger mt-1 py-1">{{ field.errors }}</div>{% endif %}
          </div>
        {% endfor %}
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
