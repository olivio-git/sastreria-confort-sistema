{% extends 'misastreria/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
