<div class="row g-3">
  <div class="col-sm-6 col-md-4">
    <div class="card card-sm">
      <div class="card-body">
        <div class="row align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-md bg-success-lt text-success">
              <i data-lucide="trending-up"></i>
            </span>
          </div>
          <div class="col">
            <div class="h2 mb-0 text-success">Bs. {{ total_ingresos|floatformat:2 }}</div>
            <div class="text-muted small">Total Ingresos</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-md-4">
    <div class="card card-sm">
      <div class="card-body">
        <div class="row align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-md bg-danger-lt text-danger">
              <i data-lucide="trending-down"></i>
            </span>
          </div>
          <div class="col">
            <div class="h2 mb-0 text-danger">Bs. {{ total_egresos|floatformat:2 }}</div>
            <div class="text-muted small">Total Egresos</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-md-4">
    <div class="card card-sm">
      <div class="card-body">
        <div class="row align-items-center">
          <div class="col-auto">
            <span class="avatar avatar-md {% if saldo >= 0 %}bg-success-lt text-success{% else %}bg-danger-lt text-danger{% endif %}">
              <i data-lucide="banknote"></i>
            </span>
          </div>
          <div class="col">
            <div class="h2 mb-0 {% if saldo >= 0 %}text-success{% else %}text-danger{% endif %}">
              Bs. {{ saldo|floatformat:2 }}
            </div>
            <div class="text-muted small">Saldo Neto</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
