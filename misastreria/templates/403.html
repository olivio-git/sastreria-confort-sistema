{% extends 'misastreria/base.html' %}

      <h2 class="page-title"><i data-lucide="shield-off" class="me-2 text-muted"></i>Sin permiso</h2>
    </div>
  </div>
</div>
{% endblock %}

{% block contenido %}

      <i data-lucide="lock" class="d-block"></i>

    </div>
  </div>
</div>
